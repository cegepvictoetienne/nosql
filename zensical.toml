[project]
site_name = "Cours de mégadonnées"
site_url = "https://nosql.profinfo.ca"
docs_dir = "wiki"
site_dir = "site"
use_directory_urls = true

nav = [
  {"Page principale" = "index.md"},
  {"Horaire" = "horaire.md"},
  {"Leçons" = [
    {"Les bases de données NoSQL" = "lecons/NoSQL.md"},
    {"MongoDB" = [
      {"Introduction à MongoDB" = "lecons/MongoDB_Introduction.md"},
      {"Commandes de base" = "lecons/MongoDB_Commandes_Base.md"},
      {"Tri, limites et regroupement" = "lecons/MongoDB_Tri_limites_regroupement.md"},
      {"Transformations" = "lecons/MongoDB_Transformations.md"},
      {"Performances et index" = "lecons/MongoDB_Performances_index.md"},
      {"Conception d'une base de données massive" = "lecons/MongoDB_Conception.md"},
      {"Révision" = "lecons/MongoDB_Revision.md"},
    ]},
    {"Graphes (Neo4j)" = [
      {"Introduction aux graphes" = "lecons/Graphes_Introduction.md"},
      {"CRUD" = "lecons/Graphes_CRUD.md"},
      {"Clauses et fonctions" = "lecons/Graphes_Clauses_fonctions.md"},
      {"Conception" = "lecons/Graphes_Conception.md"},
      {"Optimisation et modèles" = "lecons/Graphes_Optimisation_modeles.md"},
      {"Formats d'échange de graphes" = "lecons/Formats_echange_graphes.md"},
    ]},
    {"Utilisation applicative du NoSQL" = "lecons/Utilisation_applicative_NoSQL.md"},
    {"BI et sciences des données" = "lecons/BI_sciences_donnees.md"},
  ]},
  {"Exercices" = [
    {"Bâtir le laboratoire" = "exercices/Exercices_Laboratoire.md"},
    {"MongoDB – Exercices de révision" = "exercices/MongoDB_Exercices_revision.md"},
    {"Graphes – Optimisation et index (LNH)" = "exercices/Graphes_Optimisation_index_LNH.md"},
  ]},
  {"Déclaration de l'utilisation de l'IA" = "declaration-ia.md"},
]

extra_css = ["stylesheets/all.css", "stylesheets/extra.css"]

[project.theme]
name = "material"
custom_dir = "overrides"
logo = "images/logo.png"
favicon = "favicon.ico"
language = "fr"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Passer en mode sombre"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Passer en mode clair"

[project.plugins]
search = {}
